name: Deploy typing practice site

on:
  push:
    branches:
      - jasuja143-apply-pr-review-fixes
    paths:
      - "typing-master/**"
      - ".github/workflows/typing-master-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: typing-master-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload typing practice site
        uses: actions/upload-pages-artifact@v3
        with:
          path: typing-master
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
